name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pixi, container]
        distro: [humble, jazzy, lyrical, rolling]
    steps:
      - uses: actions/checkout@v4
      - run: ./ci/test.sh ${{ matrix.backend }} ${{ matrix.distro }}
